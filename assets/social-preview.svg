<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Chicago Bike-Share Rider Analysis</title>
  <desc id="desc">Social preview for a PostgreSQL data-quality and customer-segmentation case study.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1736"/>
      <stop offset="1" stop-color="#12294a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63b3ed"/>
      <stop offset="1" stop-color="#38d9c5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1188" cy="82" r="205" fill="#1e3a5f" opacity="0.58"/>
  <circle cx="1112" cy="574" r="174" fill="#0f766e" opacity="0.14"/>
  <rect x="0" y="0" width="16" height="640" fill="url(#accent)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="76" y="92" fill="#7dd3fc" font-size="25" font-weight="700" letter-spacing="4">
      PORTFOLIO CASE STUDY
    </text>
    <text x="76" y="184" fill="#f8fafc" font-size="61" font-weight="760">
      Chicago Bike-Share
    </text>
    <text x="76" y="253" fill="#f8fafc" font-size="61" font-weight="760">
      Rider Analysis
    </text>
    <text x="79" y="312" fill="#cbd5e1" font-size="28" font-weight="450">
      PostgreSQL · Data Quality · Customer Segmentation
    </text>

    <g transform="translate(76 380)" filter="url(#shadow)">
      <rect width="232" height="118" rx="20" fill="#f8fafc"/>
      <text x="24" y="40" fill="#0f172a" font-size="17" font-weight="720" letter-spacing="1.4">RAW DATA</text>
      <text x="24" y="72" fill="#334155" font-size="23" font-weight="650">12 monthly files</text>
      <text x="24" y="98" fill="#64748b" font-size="16">Aug 2022–Jul 2023</text>
    </g>

    <g transform="translate(330 380)" filter="url(#shadow)">
      <rect width="232" height="118" rx="20" fill="#e0f2fe"/>
      <text x="24" y="40" fill="#075985" font-size="17" font-weight="720" letter-spacing="1.4">QUALITY</text>
      <text x="24" y="72" fill="#0c4a6e" font-size="23" font-weight="650">Profile + validate</text>
      <text x="24" y="98" fill="#0369a1" font-size="16">Explicit audit flags</text>
    </g>

    <g transform="translate(584 380)" filter="url(#shadow)">
      <rect width="232" height="118" rx="20" fill="#ccfbf1"/>
      <text x="24" y="40" fill="#115e59" font-size="17" font-weight="720" letter-spacing="1.4">ANALYSIS</text>
      <text x="24" y="72" fill="#134e4a" font-size="23" font-weight="650">Behavior patterns</text>
      <text x="24" y="98" fill="#0f766e" font-size="16">Testable recommendations</text>
    </g>

    <path d="M308 439 H330" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
    <path d="M562 439 H584" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(895 155)" filter="url(#shadow)">
      <rect width="290" height="343" rx="28" fill="#ffffff" opacity="0.98"/>
      <text x="30" y="52" fill="#0f172a" font-size="19" font-weight="720">RIDER MIX</text>
      <text x="30" y="79" fill="#64748b" font-size="15">Original published analysis</text>

      <line x1="40" y1="278" x2="252" y2="278" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="64" y="133" width="66" height="145" rx="9" fill="#f7b267"/>
      <rect x="166" y="199" width="66" height="79" rx="9" fill="#7db7dc"/>

      <text x="97" y="116" text-anchor="middle" fill="#9a4d0b" font-size="26" font-weight="760">64.8%</text>
      <text x="199" y="182" text-anchor="middle" fill="#075985" font-size="26" font-weight="760">35.2%</text>
      <text x="97" y="312" text-anchor="middle" fill="#334155" font-size="17" font-weight="650">Member</text>
      <text x="199" y="312" text-anchor="middle" fill="#334155" font-size="17" font-weight="650">Casual</text>
    </g>

    <text x="76" y="575" fill="#94a3b8" font-size="20">
      Reproducible SQL workflow · transparent assumptions · recruiter-ready documentation
    </text>
  </g>
</svg>
